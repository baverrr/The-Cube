name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build TheCube.slnx -c Release
      - run: dotnet test TheCube.slnx -c Release --no-build
      - run: dotnet publish src/TheCube.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TheCube-win-x64
          path: publish/TheCube.exe
